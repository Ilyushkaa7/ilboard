<!doctype html>
<html lang="ru" data-theme="light">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#2563eb"><meta name="description" content="ilboard — программируемые светодиодные платы и Python."><title>ilboard</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=20261118-colors2"></head>
<body>
<header class="app-header"><a class="brand" href="./" aria-label="ilboard"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><g fill="white"><rect x="8" y="8" width="5" height="5" rx="1"/><rect x="8" y="16" width="5" height="8" rx="1"/><rect x="17" y="8" width="5" height="16" rx="1"/></g></svg><span>ilboard</span></a><div class="header-actions"><button id="import" class="button"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg><span>Импорт</span></button><button id="export" class="button"><svg viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 16v4h16v-4"/></svg><span>Скачать .ilpy</span></button><span class="header-divider"></span><button id="theme" class="icon-button" aria-label="Включить тёмную тему" title="Тёмная тема"></button></div><input type="file" id="file" accept=".ilpy" hidden></header>
<main class="app-layout">
<section class="workspace" aria-label="Платы"><div class="workspace-toolbar"><div id="boardTabs" class="board-tabs" role="tablist" aria-label="Платы проекта"></div><button id="addBoard" class="icon-button add-board" aria-label="Добавить плату" title="Добавить плату">+</button><button id="viewAll" class="icon-button view-all" aria-label="Показать все платы" title="Все платы"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button></div>
<div class="board-settings"><label class="name-field"><span>Имя</span><input id="boardName" aria-label="Имя платы" maxlength="24" value="main" autocomplete="off" spellcheck="false"></label><label class="size-field"><span>Матрица</span><select id="boardSize" aria-label="Размер матрицы"></select></label><button id="clearBoard" class="icon-button" aria-label="Очистить плату" title="Очистить плату"><svg viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2 6M4 4v7h7"/></svg></button><button id="removeBoard" class="icon-button danger" aria-label="Удалить плату" title="Удалить плату"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 10v7m4-7v7"/></svg></button></div>
<div id="boardArea" class="board-area"></div>
<div class="sensors"><div class="sensors-title">Датчики <span id="sensorBoardName">main</span></div><div class="sensor"><label for="light">Свет <output id="lightValue">70%</output></label><input id="light" aria-label="Датчик света" type="range" min="0" max="100" value="70"></div><div class="sensor"><label for="temperature">Температура <output id="temperatureValue">22°</output></label><input id="temperature" aria-label="Датчик температуры" type="range" min="-20" max="60" value="22"></div><div class="sensor"><label for="distance">Расстояние <output id="distanceValue">50 см</output></label><input id="distance" aria-label="Датчик расстояния" type="range" min="0" max="200" value="50"></div></div>
</section>
<section class="code-panel" aria-label="Редактор Python"><div class="editor-toolbar"><span class="file-tab"><svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 20"/></svg>main.ilpy</span><div><select id="examples" aria-label="Примеры программ"><option value="">Примеры</option><option value="letters">Буквы и цифры</option><option value="rainbow">Цвета</option><option value="buttons">Кнопки A / B</option><option value="sensors">Датчики</option><option value="scroll">Бегущая строка</option><option value="boards">Несколько плат</option></select><button id="api" class="icon-button" title="Команды Python" aria-label="Команды Python"><svg viewBox="0 0 24 24"><path d="M4 4h6c2 0 2 1 2 2 0-1 0-2 2-2h6v15h-6c-1 0-2 1-2 1s-1-1-2-1H4Zm8 2v14"/></svg></button></div></div>
<div class="editor-wrap"><div id="gutter" class="gutter" aria-hidden="true"></div><div class="code-content"><pre id="highlight" aria-hidden="true"><code></code></pre><textarea id="editor" aria-label="Код Python" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea></div></div>
<div class="run-toolbar"><button id="run" class="button primary"><svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg><span>Запустить</span></button><button id="stop" class="button" disabled><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>Стоп</button><kbd>Ctrl ↵</kbd></div>
<div class="console"><div class="console-toolbar"><button id="toggleConsole" aria-expanded="true">Консоль <span id="consoleChevron">⌄</span></button><button id="clearConsole" class="icon-button" aria-label="Очистить консоль" title="Очистить консоль"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg></button></div><div id="output" role="log" aria-live="polite"></div></div><div class="editor-status"><span><i id="runtimeDot"></i><span id="runtimeStatus">Загрузка Python…</span></span><span id="cursorPosition">1:1</span><span>Python 3</span></div>
</section></main>
<div id="colorPicker" class="color-picker" hidden role="dialog" aria-label="Выбор цвета"><div class="color-picker-header"><strong>Цвет</strong><button id="closeColor" class="icon-button" aria-label="Закрыть выбор цвета">✕</button></div><div class="color-inputs"><input id="colorWell" type="color" value="#2563eb" aria-label="Палитра цвета"><input id="colorHex" value="#2563eb" maxlength="7" spellcheck="false" aria-label="HEX цвета"></div><div id="colorPalette" class="color-palette"></div><button id="applyColor" class="button primary">Вставить</button></div>
<dialog id="modal"><div class="modal-header"><h2 id="modalTitle"></h2><button id="closeModal" class="icon-button" aria-label="Закрыть">✕</button></div><div id="modalBody"></div></dialog><div id="toast" role="status"></div><script type="module" src="app.js?v=20261118-colors"></script>
</body></html>
